name: Desktop installer

# Builds the CastBay Desktop installers (MSI) from the already released portable program and runs
# them on the runner: install, install over, start, uninstall (desktop/installer/test-install.ps1). Quick,
# so changes to the installer script are tried without rebuilding FFmpeg and the app.
on:
  push:
    branches: [main]
    paths: ['desktop/installer/**', '.github/workflows/desktop-installer.yml']
  pull_request:
    paths: ['desktop/installer/**', '.github/workflows/desktop-installer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get WiX
        run: dotnet tool install --global wix --version 4.0.5

      # The released program stands in for a fresh build.
      - name: Get the released program
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download desktop-v0.1.0 --repo $env:GITHUB_REPOSITORY --pattern '*windows-x64.zip' --dir "$env:RUNNER_TEMP\release"
          Expand-Archive "$env:RUNNER_TEMP\release\*.zip" -DestinationPath "$env:RUNNER_TEMP\release\unzipped"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\release\unzipped" -Directory | Select-Object -First 1
          Copy-Item "$($dir.FullName)\CastBay Desktop.exe" "$env:RUNNER_TEMP\app.exe"
          Copy-Item "$($dir.FullName)\LICENSE" "$env:RUNNER_TEMP\LICENSE"

      - name: Build the installers
        run: ./desktop/installer/build-msi.ps1 -Version 0.1.0 -AppExe "$env:RUNNER_TEMP\app.exe" -LicenseTxt "$env:RUNNER_TEMP\LICENSE" -OutDir "$env:RUNNER_TEMP\msi" -NameStem CastBay-Desktop-0.1.0-windows-x64

      - name: Install, install over, start, uninstall (each language)
        run: |
          foreach ($m in Get-ChildItem "$env:RUNNER_TEMP\msi\*.msi") {
            "== $($m.Name)"
            ./desktop/installer/test-install.ps1 -Msi $m.FullName -Version 0.1.0
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CastBay-Desktop-installer-test
          path: ${{ runner.temp }}\msi\*.msi
          retention-days: 7
