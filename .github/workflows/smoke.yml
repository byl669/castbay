name: Smoke test

# Before a release: starts the debug app on emulators and checks that its local network discovery
# comes up on every start (the failures of #214 and #239 were here). Run by hand (Actions > Smoke
# test > Run workflow); a pull request that changes this file or the script runs it too. Not part of
# every pull request: it takes a while. The app has only ARM native libraries, so the emulators are
# the Android 11+ x86_64 images, which translate ARM; Android 6 to 10 are checked on a local
# emulator and real TVs.
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/smoke.yml', 'tools/ci/smoke.sh']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Fetch the app's submodules
        run: git submodule update --init -- third_party/UxPlay third_party/alac third_party/libplist third_party/openssl
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Note the OpenSSL commit
        id: openssl
        run: echo "commit=$(git rev-parse HEAD:third_party/openssl)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/openssl-android
          key: openssl-android-${{ steps.openssl.outputs.commit }}-ndk27.0.12077973
      - name: Install the pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - name: Build the debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 34]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smoke-apk
          path: apk
      # The emulator needs hardware acceleration, which the runner offers through KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app five times on an Android ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh tools/ci/smoke.sh apk/app-debug.apk
