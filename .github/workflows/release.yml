name: Release

# Push a tag like v1.0.80 to build a signed release APK and publish it, with the complete
# source (including submodules, as GPL-3.0 requires), as the latest release. A tag with a
# suffix, like v1.0.80-beta, is published as a pre-release instead, for testers.
#
# A full release also carries the APK as CastBay.apk, so
# https://github.com/weenas/castbay/releases/latest/download/CastBay.apk (the website's
# download button) always serves the newest one.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Creating the release and uploading its files.
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The app's submodules are fetched below; desktop/third_party (FFmpeg and friends,
          # hundreds of MB) is only for CastBay Desktop.
          submodules: false
      # Top level only: OpenSSL's own submodules (test data, other libraries) aren't needed.
      - name: Fetch the app's submodules
        run: git submodule update --init -- third_party/UxPlay third_party/alac third_party/libplist third_party/openssl

      - name: Check the tag matches the app version
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          # VERSION names the files: 1.0.80, or 1.0.80-beta for a pre-release.
          echo "VERSION=$tag" >> "$GITHUB_ENV"
          if [ "$tag" != "$version" ]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
            # -beta.1 of v1.8.7-beta.1: the built app says 1.8.7-beta.1 (app/build.gradle.kts).
            echo "RELEASE_SUFFIX=-${tag#*-}" >> "$GITHUB_ENV"
          fi

      # GitHub's automatic source archives leave out submodules (UxPlay, libplist, ALAC).
      - name: Package the complete source
        run: |
          tar --exclude=.git --exclude='*/.git' \
            -czf "$RUNNER_TEMP/CastBay-$VERSION-source.tar.gz" \
            --transform "s,^\.,CastBay-$VERSION," .

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # OpenSSL's libcrypto, built from the submodule (tools/build-openssl.sh, which Gradle runs);
      # kept between runs until the submodule or the NDK changes.
      - name: Note the OpenSSL commit
        id: openssl
        run: echo "commit=$(git rev-parse HEAD:third_party/openssl)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/openssl-android
          key: openssl-android-${{ steps.openssl.outputs.commit }}-ndk27.0.12077973

      - name: Install the pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.CASTBAY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The CASTBAY_KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/castbay-release.jks"
          echo "CASTBAY_KEYSTORE_FILE=$RUNNER_TEMP/castbay-release.jks" >> "$GITHUB_ENV"

      # lintVitalRelease crashes inside AGP's lint (a tooling bug), so it is skipped.
      - name: Build the signed release APK
        env:
          CASTBAY_KEYSTORE_PASSWORD: ${{ secrets.CASTBAY_KEYSTORE_PASSWORD }}
          CASTBAY_KEY_ALIAS: ${{ secrets.CASTBAY_KEY_ALIAS }}
          CASTBAY_KEY_PASSWORD: ${{ secrets.CASTBAY_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease :app:testDebugUnitTest ${RELEASE_SUFFIX:+-PreleaseSuffix=$RELEASE_SUFFIX} \
            -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/CastBay-$VERSION.apk"
          # R8 shortens names in release builds; this maps a crash's stack trace back to the
          # source (retrace). Names only, nothing secret.
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/CastBay-$VERSION-mapping.txt"

      - name: Check it is signed with the release key, not the debug key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs="$("$apksigner" verify --print-certs "$RUNNER_TEMP/CastBay-$VERSION.apk")"
          echo "$certs" | grep "certificate DN"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The APK is debug-signed"
            exit 1
          fi
          echo "CERT_SHA256=$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)" >> "$GITHUB_ENV"

      # The release notes are the website's changelog entries for this version, in English
      # then Chinese (web/src/content/releases/<lang>/<version>.md); a full release must have
      # both. GitHub's list of merged pull requests follows them.
      - name: Release notes from the changelog
        run: |
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          for lang in en zh; do
            file="web/src/content/releases/$lang/${VERSION%%-*}.md"
            if [ ! -f "$file" ]; then
              if [ "$PRERELEASE" = true ]; then continue; fi
              echo "::error::No release notes in $file: add the changelog entry for this version"
              exit 1
            fi
            if [ "$lang" = en ]; then echo "## What's new" >> "$notes"; else echo "## 更新内容" >> "$notes"; fi
            # Everything after the front matter (the second ---).
            awk 'n >= 2 { print } /^---$/ { n++ }' "$file" >> "$notes"
            echo >> "$notes"
          done
          # How to check the download (the website's changelog lists the same, from GitHub).
          {
            echo "## Verification"
            echo
            echo "- SHA-256 of \`CastBay-$VERSION.apk\`: \`$(sha256sum "$RUNNER_TEMP/CastBay-$VERSION.apk" | cut -d' ' -f1)\`"
            echo "- Signing certificate (CN=CastBay, O=weenas), SHA-256: \`$CERT_SHA256\`"
            echo
          } >> "$notes"
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP/CastBay-$VERSION.apk" "$RUNNER_TEMP/CastBay-$VERSION-source.tar.gz" "$RUNNER_TEMP/CastBay-$VERSION-mapping.txt")
          if [ "$PRERELEASE" = true ]; then
            kind=--prerelease
          else
            kind=--latest
            cp "$RUNNER_TEMP/CastBay-$VERSION.apk" "$RUNNER_TEMP/CastBay.apk"
            files+=("$RUNNER_TEMP/CastBay.apk")
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "CastBay $VERSION" \
            "$kind" \
            --notes-file "$NOTES_FILE" \
            --generate-notes

      # Rebuilds the website, so its changelog lists this release's checksum at once. Needs a
      # Cloudflare deploy hook URL in the CLOUDFLARE_DEPLOY_HOOK secret; without one it is skipped
      # and the checksum appears with the website's next update.
      - name: Rebuild the website
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No CLOUDFLARE_DEPLOY_HOOK secret; skipped"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Website rebuild started"

      - name: Clean up the key
        if: always()
        run: rm -f "$RUNNER_TEMP/castbay-release.jks"
