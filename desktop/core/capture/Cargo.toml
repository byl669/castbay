[package]
name = "castbay-capture"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Screen and window capture for CastBay Desktop"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-capture = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
]

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "inhibit"] }
pipewire = "0.10"
tokio = { version = "1", features = ["rt-multi-thread"] }
