[package]
name = "castbay-encode"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Real-time H.264 encoding for CastBay Desktop"

[features]
# Encode in-process with the FFmpeg libraries built by tools/build-ffmpeg.
ffmpeg-lib = []

[dependencies]

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Ole",
    "Win32_System_Variant",
]
