<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CastBay Desktop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-cast" viewBox="0 0 24 24"><path d="M3 18a3 3 0 0 1 3 3M3 14a7 7 0 0 1 7 7M3 10a11 11 0 0 1 11 11"/><path d="M3 6V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="18" cy="18" r="2.2"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11A8 8 0 0 0 5.6 6.6L4 8.5"/><path d="M4 4v4.5h4.5"/><path d="M4 13a8 8 0 0 0 14.4 4.4L20 15.5"/><path d="M20 20v-4.5h-4.5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-signal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M12 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/><path d="M11 13l9-9M15 4h5v5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></symbol>
  </defs>
</svg>

<div id="app">
  <header class="topbar">
    <button id="back" class="icon-btn" hidden data-aria="back"><svg class="ic"><use href="#i-back"/></svg></button>
    <h1 id="title"><svg class="ic brand"><use href="#i-cast"/></svg><span id="title-text" data-i18n="app_name"></span></h1>
    <button id="open-settings" class="icon-btn" data-aria="settings"><svg class="ic"><use href="#i-gear"/></svg></button>
  </header>

  <main>
    <div id="notices">
      <div id="update" class="notice info" hidden><svg class="ic"><use href="#i-info"/></svg><span id="update-text"></span><button id="update-notes" class="link" data-i18n="update_notes"></button><button id="update-open" class="link" data-i18n="update_now"></button></div>
      <div id="crash" class="notice warn" hidden><svg class="ic"><use href="#i-alert"/></svg><span id="crash-text"></span><button id="crash-send" class="link" data-i18n="crash_send"></button><button id="crash-dismiss" class="link" data-i18n="crash_dismiss"></button></div>
      <div id="error-box" class="notice danger" role="alert" hidden><svg class="ic"><use href="#i-alert"/></svg><span id="error"></span><button id="forget" class="link" hidden data-i18n="forget_receiver"></button></div>
    </div>

    <section id="view-home" class="view">
      <div id="welcome" class="card welcome" hidden>
        <h2 data-i18n="w_title"></h2>
        <ol>
          <li data-i18n="w_1"></li>
          <li data-i18n="w_2"></li>
          <li data-i18n="w_3"></li>
        </ol>
        <button id="welcome-ok" class="btn secondary" data-i18n="got_it"></button>
      </div>

      <div class="section-head">
        <h2 data-i18n="receivers"></h2>
        <button id="refresh" class="icon-btn small" data-aria="refresh"><svg class="ic"><use href="#i-refresh"/></svg></button>
      </div>
      <ul id="receiver-list" class="receivers" role="listbox" aria-labelledby="title-text"></ul>
      <div id="empty" class="empty" hidden>
        <svg class="ic big"><use href="#i-signal"/></svg>
        <p class="strong" data-i18n="empty_title"></p>
        <p class="muted" data-i18n="empty_body"></p>
        <button id="empty-retry" class="btn secondary" data-i18n="search_again"></button>
      </div>
      <label id="password-row" class="field" hidden>
        <span data-i18n="password"></span>
        <input id="password" type="password" autocomplete="off">
      </label>

      <div class="section-head"><h2 data-i18n="what"></h2></div>
      <div class="segmented" role="radiogroup" data-aria="what">
        <button type="button" role="radio" id="kind-monitor" data-kind="monitor"><span data-i18n="screen"></span></button>
        <button type="button" role="radio" id="kind-window" data-kind="window"><span data-i18n="window"></span></button>
      </div>
      <select id="source" class="select" data-aria="source"></select>
      <p id="system-picker-note" class="muted" data-i18n="system_picker" hidden></p>
    </section>

    <section id="view-casting" class="view" hidden>
      <div class="hero">
        <div class="pulse"><svg class="ic xl"><use href="#i-signal"/></svg></div>
        <p id="state-line" class="hero-title"></p>
        <p id="receiver-line" class="hero-sub"></p>
        <p id="detail-line" class="muted"></p>
      </div>
      <div id="code-box" class="card" hidden>
        <p data-i18n="code_prompt"></p>
        <div class="code-row">
          <input id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000" data-aria="code">
          <button id="code-ok" class="btn primary" data-i18n="ok"></button>
        </div>
      </div>
      <div id="lock-note" class="notice warn" hidden><svg class="ic"><use href="#i-lock"/></svg><span data-i18n="locked_note"></span></div>
      <details id="details" class="card details">
        <summary><span data-i18n="details"></span><svg class="ic chev"><use href="#i-down"/></svg></summary>
        <dl id="stats">
          <div><dt data-i18n="s_decode"></dt><dd id="s-decode">–</dd></div>
          <div><dt data-i18n="s_fps"></dt><dd id="s-fps">–</dd></div>
          <div><dt data-i18n="s_dropped"></dt><dd id="s-dropped">–</dd></div>
          <div><dt data-i18n="s_rate"></dt><dd id="s-rate">–</dd></div>
        </dl>
      </details>
      <p class="muted center" data-i18n="tray_hint"></p>
    </section>

    <section id="view-settings" class="view" hidden>
      <div class="section-head"><h2 data-i18n="s_quality"></h2></div>
      <div class="list">
        <label class="row slider-row"><span data-i18n="s_bitrate"></span><span class="slider"><input id="bitrate" type="range" min="2" max="20" step="1" data-aria="s_bitrate"><span id="bitrate-ticks" class="ticks" aria-hidden="true"></span></span><output id="bitrate-value"></output></label>
        <div class="row"><span data-i18n="s_fps"></span>
          <div class="segmented fps" role="radiogroup" data-aria="s_fps">
            <button type="button" role="radio" data-fps="30"><span data-i18n="fps_30"></span></button>
            <button type="button" role="radio" data-fps="60"><span data-i18n="fps_60"></span></button>
          </div>
        </div>
      </div>
      <p id="quality-note" class="muted note"></p>
      <div class="list">
        <div class="row"><span data-i18n="s_audio"></span><button id="audio" class="switch" role="switch" aria-checked="false" data-aria="s_audio"></button></div>
        <label class="row"><span data-i18n="s_encoder"></span><select id="encoder" class="select inline">
          <option value="auto" data-i18n="e_auto"></option>
        </select></label>
      </div>
      <p id="encoder-note" class="muted note" data-i18n="encoder_note"></p>

      <div class="section-head"><h2 data-i18n="s_general"></h2></div>
      <div class="list">
        <div class="row"><span data-i18n="s_autostart"></span><button id="autostart" class="switch" role="switch" aria-checked="false" data-aria="s_autostart"></button></div>
        <label class="row"><span data-i18n="s_language"></span><select id="language" class="select inline">
          <option value="auto" data-i18n="lang_auto"></option><option value="zh">中文</option><option value="en">English</option>
        </select></label>
        <div class="row"><span data-i18n="s_check_updates"></span><button id="check-updates-auto" class="switch" role="switch" aria-checked="false" data-aria="s_check_updates"></button></div>
        <div class="row"><span data-i18n="s_error_reports"></span><button id="error-reports" class="switch" role="switch" aria-checked="false" data-aria="s_error_reports"></button></div>
        <button id="open-paired" class="row link-row"><span data-i18n="s_paired"></span><span class="row-end"><span id="paired-count" class="muted"></span><svg class="ic small"><use href="#i-chevron"/></svg></span></button>
      </div>

      <p id="error-reports-note" class="muted note"></p>
      <div class="list">
        <button id="reset" class="row link-row"><span id="reset-text" data-i18n="s_reset"></span><svg class="ic small"><use href="#i-refresh"/></svg></button>
      </div>

      <div class="section-head"><h2 data-i18n="s_about"></h2></div>
      <div class="list">
        <div class="row"><span><span data-i18n="s_version"></span> <span id="version">–</span></span><span id="update-status" class="muted"></span></div>
        <button id="check-update" class="row link-row"><span data-i18n="s_check_update"></span><svg class="ic small"><use href="#i-refresh"/></svg></button>
        <button id="open-diagnostics" class="row link-row"><span data-i18n="s_diagnostics"></span><svg class="ic small"><use href="#i-chevron"/></svg></button>
        <button id="feedback" class="row link-row"><span data-i18n="s_feedback"></span><svg class="ic small"><use href="#i-external"/></svg></button>
        <button id="logs" class="row link-row"><span data-i18n="s_logs"></span><svg class="ic small"><use href="#i-external"/></svg></button>
        <button id="open-source" class="row link-row"><span data-i18n="s_license"></span><svg class="ic small"><use href="#i-external"/></svg></button>
      </div>
    </section>

    <section id="view-diagnostics" class="view" hidden>
      <p class="muted note" data-i18n="diag_intro"></p>
      <dl id="diag-info" class="facts"></dl>
      <div class="section-head"><h2 data-i18n="diag_log"></h2></div>
      <pre id="diag-log" class="logbox" tabindex="0"></pre>
      <div id="diag-ask" class="notice info" hidden>
        <svg class="ic"><use href="#i-info"/></svg>
        <span data-i18n="diag_ask"></span>
      </div>
      <div class="diag-actions">
        <button id="diag-upload" class="btn secondary" data-i18n="diag_upload"></button>
        <button id="diag-confirm" class="btn primary" hidden data-i18n="diag_confirm"></button>
        <button id="diag-cancel" class="btn secondary" hidden data-i18n="diag_cancel"></button>
      </div>
      <p id="diag-result" class="note" role="status"></p>
    </section>

    <section id="view-paired" class="view" hidden>
      <p class="muted note" data-i18n="paired_intro"></p>
      <ul id="paired-list" class="list"></ul>
      <p id="paired-empty" class="muted center" hidden data-i18n="paired_none"></p>
    </section>
  </main>

  <footer id="action-bar" class="action-bar">
    <p id="action-summary" class="summary"></p>
    <button id="start" class="btn primary wide" data-i18n="start"></button>
    <button id="stop" class="btn danger wide" hidden data-i18n="stop"></button>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
