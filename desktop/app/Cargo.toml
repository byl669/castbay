[package]
name = "castbay-desktop"
version = "0.1.3"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CastBay Desktop: cast a Windows screen or window to CastBay receivers"

[features]
# Encode with the FFmpeg libraries built in (tools/build-ffmpeg) instead of an FFmpeg process.
ffmpeg-lib = ["castbay-sender/ffmpeg-lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
castbay-capture = { path = "../core/capture" }
castbay-link = { path = "../core/link" }
castbay-sender = { path = "../core/sender" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = ["Win32_Globalization", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"]
